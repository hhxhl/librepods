name: Build LibrePods Hhxhl

on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build'
        required: true
        default: 'main-hhxhl'
        type: string
      upload_name:
        description: 'Artifact name'
        required: false
        default: 'librepods-hhxhl'
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main-hhxhl'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The upstream Blacksmith 8-vCPU / 16-GB-heap settings are too large for
      # some GitHub-hosted runners; use more conservative limits here.
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Dkotlin.daemon.jvm.options="-Xmx1536m" -Dorg.gradle.workers.max=2'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_branch }}
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;30.0.14904198'

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_FILE secret}"
          : "${STORE_PASSWORD:?Missing RELEASE_STORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing RELEASE_KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD secret}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore
          {
            printf '%s\n' 'RELEASE_STORE_FILE=../release.keystore'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > android/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release artifacts
        working-directory: android
        run: ./gradlew collectReleaseArtifacts --stacktrace

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob

          release_apks=(release/*release.apk)
          if (( ${#release_apks[@]} == 0 )); then
            echo 'ERROR: No release APK found!'
            ls -lah release/ || true
            exit 1
          fi

          output_files=(release/*.apk release/*.aab release/*.zip)
          cp "${output_files[@]}" artifacts/
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload_name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 10

  cleanup:
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/main-hhxhl' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Keep latest 5 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_ID=$(gh api \
            "repos/$REPO/actions/runs/$CURRENT_RUN" \
            --jq '.workflow_id')

          gh api --paginate --slurp \
            "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100" |
          jq -r '
            [.[].workflow_runs[]]
            | sort_by(.run_number)
            | reverse
            | .[5:][]
            | select(.status == "completed")
            | .id
          ' |
          while read -r RUN_ID; do
            if [[ "$RUN_ID" != "$CURRENT_RUN" ]]; then
              echo "Deleting workflow run $RUN_ID"
              gh api --method DELETE \
                "repos/$REPO/actions/runs/$RUN_ID"
            fi
          done
